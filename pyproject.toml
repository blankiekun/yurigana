[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yurigana"
version = "0.5.1"
description = "Readings of Japanese kanji words in context: a book's ruby, hand rules, a small reading model and Sudachi"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause AND CC-BY-SA-4.0"
license-files = ["LICENSE", "NOTICE"]
# The dictionary is pinned: readings (and the numbers in README.md) depend on its version.
dependencies = ["SudachiPy>=0.7,<0.8", "SudachiDict-core==20260723.1"]

[project.optional-dependencies]
# The full dictionary, read with YURIGANA_SUDACHI_DICT=full (same readings on the README sets, 120 MB more)
full = ["SudachiDict-full==20260723.1"]
# Baselines for python -m yurigana.evaluate (UniDic full: pip install unidic && python -m unidic download)
# ginza and yomikata conflict with SudachiPy 0.7 / need torch 1.13: a second environment (yurigana/evaluate.py)
eval = ["fugashi", "ipadic", "unidic-lite", "pykakasi"]

[project.urls]
Source = "https://github.com/blankiekun/yurigana"

[tool.setuptools]
packages = ["yurigana"]

[tool.setuptools.package-data]
yurigana = ["*.json", "*.json.gz", "*.tsv", "*.txt.gz"]

[tool.ruff.lint]
# pyflakes only: unused and undefined names; the code's own style (long lines, aligned tables) stays
select = ["F"]
