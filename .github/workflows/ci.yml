name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install . ruff==0.17.1 SudachiDict-core==20260723.1  # the tests and README numbers were recorded with it
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest -v
      - name: The installed package reads with no setup
        run: cd /tmp && python -c "import yurigana; print(yurigana.Reader().read('人気のない道を歩いた。'))"

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests
        run: node --test 'js/*.test.js'
